<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Secure QR...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f9fc;
        }

        .box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            color: #dc2626;
            margin-top: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="spinner" id="spinner"></div>
        <h2 id="statusMessage">Verifying Digital Signature...</h2>
        <p id="errorMsg" class="error"></p>
    </div>
    <script>
        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('t');

            if (!token) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('statusMessage').textContent = 'Invalid QR Code';
                document.getElementById('errorMsg').textContent = 'No security token found in the scan.';
                return;
            }

            try {
                const res = await fetch('/api/verify-secure-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.message || 'Signature verification failed.');
                }

                document.getElementById('statusMessage').textContent = 'Verified Successfully!';
                document.getElementById('statusMessage').style.color = '#16a34a';
                setTimeout(() => {
                    window.location.replace(`child-summary.html?childId=${encodeURIComponent(data.childID)}`);
                }, 1000);
            } catch (err) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('statusMessage').textContent = 'Verification Failed';
                document.getElementById('errorMsg').textContent = err.message;
            }
        };
    </script>
</body>

</html>
